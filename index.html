<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trimariachi Familiar</title>
    <style>
        /* Estilos generales */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
        }
        h1, h2, h3 {
            font-family: 'Georgia', serif;
            color: #d4af37; /* Color dorado */
        }
        p {
            line-height: 1.6;
            color: #cccccc;
        }
        .section-title {
            text-align: center;
            margin-bottom: 40px;
        }
        .section-title h2 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .section-title hr {
            width: 80px;
            border: 1px solid #d4af37;
            margin: 0 auto;
        }

        /* Sección Header / Inicio */
        .hero {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('fondo_mariachi.jpg') center/cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 8%;
        }
        .hero-content {
            max-width: 600px;
            text-align: left;
        }
        .hero-content img.logo {
            max-width: 250px;
            margin-bottom: 20px;
        }
        .hero-content h1 {
            font-size: 3.5rem;
            margin: 0 0 15px 0;
            line-height: 1.1;
        }
        .hero-content .subtitle {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .hero-content .highlight {
            font-size: 1.3rem;
            color: #d4af37;
            font-weight: bold;
        }

        /* REPRODUCTOR DE VIDEO PERSONALIZADO (Autoplay, sin controles, botón de audio) */
        .custom-video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #333;
            background-color: #000;
        }
        .custom-video-wrapper video {
            width: 100%;
            display: block;
            pointer-events: none; /* Evita que el usuario pause dándole clic al video */
        }
        .mute-btn {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid #d4af37;
            padding: 8px 16px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            z-index: 10;
        }
        .mute-btn:hover {
            background-color: #d4af37;
            color: #000;
        }

        /* Secciones de video individuales */
        .video-destacado-section {
            padding: 60px 8%;
            background-color: #0a0a0a;
            text-align: center;
        }
        .video-destacado-container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Sección Nuestra Historia */
        .historia {
            padding: 80px 8%;
            background-color: #111111;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
            flex-wrap: wrap;
        }
        .historia-texto {
            flex: 1;
            min-width: 300px;
        }
        .historia-texto h2 {
            font-size: 2.2rem;
            margin-bottom: 20px;
        }
        .historia-texto p {
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        .historia-imagen {
            flex: 1;
            min-width: 300px;
            text-align: center;
        }
        .historia-imagen img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
